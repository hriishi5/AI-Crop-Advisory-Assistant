openapi: 3.1.0
info:
  # Keep this title stable: code generation uses it for import paths.
  title: Api
  version: 0.1.0
  description: KisanSaathi agriculture advisory API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: profile
  - name: farms
  - name: advisories
  - name: diagnostics
  - name: dashboard
  - name: history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a farmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in a farmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged-in farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current farmer
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentFarmer
      tags: [auth]
      summary: Get current farmer
      responses:
        "200":
          description: Current farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update farmer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
  /farms:
    get:
      operationId: listFarms
      tags: [farms]
      summary: List active farms
      responses:
        "200":
          description: Farm list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Farm"
    post:
      operationId: createFarm
      tags: [farms]
      summary: Create a farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "201":
          description: Created farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
  /farms/{farmId}:
    get:
      operationId: getFarm
      tags: [farms]
      summary: Get a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
    patch:
      operationId: updateFarm
      tags: [farms]
      summary: Update a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "200":
          description: Updated farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
    delete:
      operationId: archiveFarm
      tags: [farms]
      summary: Archive a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Archived farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /farms/{farmId}/advisories:
    get:
      operationId: listFarmAdvisories
      tags: [advisories]
      summary: List advisories for a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Advisory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advisory"
    post:
      operationId: createAdvisory
      tags: [advisories]
      summary: Generate a crop advisory
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisoryInput"
      responses:
        "201":
          description: Generated advisory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisory"
  /advisories/{advisoryId}:
    get:
      operationId: getAdvisory
      tags: [advisories]
      summary: Get an advisory
      parameters:
        - $ref: "#/components/parameters/AdvisoryId"
      responses:
        "200":
          description: Advisory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advisory"
  /farms/{farmId}/diagnostics:
    get:
      operationId: listFarmDiagnostics
      tags: [diagnostics]
      summary: List diagnostics for a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Diagnostic list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Diagnostic"
    post:
      operationId: createDiagnostic
      tags: [diagnostics]
      summary: Generate a crop health diagnosis
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticInput"
      responses:
        "201":
          description: Generated diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostic"
  /diagnostics/{diagnosticId}:
    get:
      operationId: getDiagnostic
      tags: [diagnostics]
      summary: Get a diagnostic
      parameters:
        - $ref: "#/components/parameters/DiagnosticId"
      responses:
        "200":
          description: Diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostic"
  /diagnostics/{diagnosticId}/resolve:
    patch:
      operationId: resolveDiagnostic
      tags: [diagnostics]
      summary: Resolve a diagnostic
      parameters:
        - $ref: "#/components/parameters/DiagnosticId"
      responses:
        "200":
          description: Resolved diagnostic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostic"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /history:
    get:
      operationId: getHistory
      tags: [history]
      summary: Search combined history
      parameters:
        - name: farmId
          in: query
          schema: { type: string, format: uuid }
        - name: crop
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: type
          in: query
          schema:
            type: string
            enum: [all, advisory, diagnostic]
            default: all
      responses:
        "200":
          description: Combined history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryItem"
components:
  parameters:
    FarmId:
      name: farmId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdvisoryId:
      name: advisoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DiagnosticId:
      name: diagnosticId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    Farmer:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        primaryLanguage: { type: string }
        defaultState: { type: ["string", "null"] }
        defaultDistrict: { type: ["string", "null"] }
      required: [id, fullName, email, primaryLanguage]
    RegisterInput:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        phone: { type: string, minLength: 10, maxLength: 15 }
      required: [fullName, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
      required: [email, password]
    ProfileUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: ["string", "null"], maxLength: 20 }
        primaryLanguage: { type: string, maxLength: 40 }
        defaultState: { type: ["string", "null"], maxLength: 80 }
        defaultDistrict: { type: ["string", "null"], maxLength: 80 }
    Farm:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        village: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        gpsLat: { type: ["number", "null"] }
        gpsLng: { type: ["number", "null"] }
        soilType:
          type: string
          enum: [alluvial, black, red, laterite, arid, mountain, saline_alkaline]
        areaAcres: { type: number }
        primaryIrrigation:
          type: string
          enum: [rainfed, canal, borewell, drip_sprinkler, mixed]
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, soilType, areaAcres, primaryIrrigation, isArchived, createdAt]
    FarmInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        village: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 80 }
        state: { type: string, maxLength: 80 }
        gpsLat: { type: number, minimum: -90, maximum: 90 }
        gpsLng: { type: number, minimum: -180, maximum: 180 }
        soilType:
          type: string
          enum: [alluvial, black, red, laterite, arid, mountain, saline_alkaline]
        areaAcres: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        primaryIrrigation:
          type: string
          enum: [rainfed, canal, borewell, drip_sprinkler, mixed]
      required: [name, soilType, areaAcres, primaryIrrigation]
    AdvisoryInput:
      type: object
      properties:
        season: { type: string, enum: [kharif, rabi, zaid] }
        soilTypeOverride:
          type: string
          enum: [alluvial, black, red, laterite, arid, mountain, saline_alkaline]
        landAreaAcres: { type: number, exclusiveMinimum: 0 }
        irrigationAvailability:
          type: string
          enum: [rainfed, canal, borewell, drip_sprinkler, mixed]
        budgetTier: { type: string, enum: [low, medium, high] }
        previousCrop: { type: string, maxLength: 80 }
        knownSoilIssues:
          type: array
          items:
            type: string
            enum: [waterlogging, salinity, low_organic_matter, erosion, none]
        farmerGoal:
          type: string
          enum: [maximize_yield, maximize_profit, minimize_risk, soil_health_recovery]
        additionalNotes: { type: string, maxLength: 500 }
      required: [season, irrigationAvailability, budgetTier, farmerGoal]
    RecommendedCrop:
      type: object
      properties:
        cropName: { type: string }
        rank: { type: integer }
        suitabilityReason: { type: string }
        estimatedYieldPerAcre: { type: string }
        estimatedInputCostPerAcre: { type: string }
        estimatedRevenuePerAcre: { type: string }
      required: [cropName, rank, suitabilityReason, estimatedYieldPerAcre, estimatedInputCostPerAcre, estimatedRevenuePerAcre]
    StagePlan:
      type: object
      properties:
        sowingStage: { type: string }
        vegetativeStage: { type: string }
        floweringStage: { type: string }
        maturityStage: { type: string }
      required: [sowingStage, vegetativeStage, floweringStage, maturityStage]
    IrrigationPlan:
      allOf:
        - $ref: "#/components/schemas/StagePlan"
        - type: object
          properties:
            frequencySummary: { type: string }
          required: [frequencySummary]
    RiskFactor:
      type: object
      properties:
        risk: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        mitigation: { type: string }
      required: [risk, severity, mitigation]
    Advisory:
      type: object
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        season: { type: string, enum: [kharif, rabi, zaid] }
        soilTypeUsed: { type: string }
        landAreaAcresUsed: { type: number }
        irrigationUsed: { type: string }
        budgetTier: { type: string, enum: [low, medium, high] }
        previousCrop: { type: ["string", "null"] }
        knownSoilIssues:
          type: array
          items: { type: string }
        farmerGoal: { type: string }
        recommendedCrops:
          type: array
          items: { $ref: "#/components/schemas/RecommendedCrop" }
        fertilizerPlan: { $ref: "#/components/schemas/StagePlan" }
        irrigationPlan: { $ref: "#/components/schemas/IrrigationPlan" }
        riskFactors:
          type: array
          items: { $ref: "#/components/schemas/RiskFactor" }
        confidenceScore: { type: number, minimum: 0, maximum: 1 }
        modelVersion: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, farmId, farmName, season, soilTypeUsed, landAreaAcresUsed, irrigationUsed, budgetTier, knownSoilIssues, farmerGoal, recommendedCrops, fertilizerPlan, irrigationPlan, riskFactors, confidenceScore, modelVersion, createdAt]
    DiagnosticInput:
      type: object
      properties:
        affectedCrop: { type: string, minLength: 2, maxLength: 80 }
        growthStage: { type: string, enum: [seedling, vegetative, flowering, fruiting, maturity] }
        symptomCategory:
          type: string
          enum: [fungal, bacterial, viral, insect_pest, nutrient_deficiency, nematode, weed_competition, unsure]
        symptomDescription: { type: string, minLength: 20, maxLength: 1000 }
        affectedPlantPart:
          type: array
          minItems: 1
          items: { type: string, enum: [leaves, stem, roots, fruit, flower, whole_plant] }
        daysSinceSymptomsAppeared: { type: integer, minimum: 0 }
        weatherRecent: { type: string, enum: [dry, normal_rain, heavy_rain, unusual_heat, unusual_cold] }
      required: [affectedCrop, growthStage, symptomDescription, affectedPlantPart]
    PossibleCause:
      type: object
      properties:
        cause: { type: string }
        type: { type: string, enum: [fungal, bacterial, viral, insect_pest, nutrient_deficiency, nematode, weed_competition] }
        likelihood: { type: string, enum: [low, medium, high] }
      required: [cause, type, likelihood]
    TreatmentPlan:
      type: object
      properties:
        organicOption: { type: string }
        chemicalOption: { type: string }
        applicationGuidance: { type: string }
      required: [organicOption, chemicalOption, applicationGuidance]
    Diagnostic:
      type: object
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        affectedCrop: { type: string }
        growthStage: { type: string }
        symptomCategory: { type: ["string", "null"] }
        symptomDescription: { type: string }
        affectedPlantPart:
          type: array
          items: { type: string }
        daysSinceSymptomsAppeared: { type: ["integer", "null"] }
        weatherRecent: { type: ["string", "null"] }
        likelyDiagnosis: { type: string }
        confidenceScore: { type: number, minimum: 0, maximum: 1 }
        possibleCauses:
          type: array
          items: { $ref: "#/components/schemas/PossibleCause" }
        treatmentPlan: { $ref: "#/components/schemas/TreatmentPlan" }
        preventionTips:
          type: array
          items: { type: string }
        isResolved: { type: boolean }
        modelVersion: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, farmId, farmName, affectedCrop, growthStage, symptomDescription, affectedPlantPart, likelyDiagnosis, confidenceScore, possibleCauses, treatmentPlan, preventionTips, isResolved, modelVersion, createdAt]
    RecentAdvisory:
      type: object
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        season: { type: string }
        topCrop: { type: string }
        confidenceScore: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, farmId, farmName, season, topCrop, confidenceScore, createdAt]
    DashboardSummary:
      type: object
      properties:
        farmCount: { type: integer }
        advisoryCount: { type: integer }
        diagnosticCount: { type: integer }
        unresolvedDiagnosticCount: { type: integer }
        recentAdvisories:
          type: array
          items: { $ref: "#/components/schemas/RecentAdvisory" }
      required: [farmCount, advisoryCount, diagnosticCount, unresolvedDiagnosticCount, recentAdvisories]
    HistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [advisory, diagnostic] }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        title: { type: string }
        subtitle: { type: string }
        confidenceScore: { type: number }
        isResolved: { type: ["boolean", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, type, farmId, farmName, title, subtitle, confidenceScore, createdAt]